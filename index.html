<!DOCTYPE html><!-- Instrução especial que indica aos navegadores que utilizem a versão HTML 5 para exibir a página --> 
<html lang="pt-br"><!--A tag <html> e </html> ao final do código, demarcam todo o código ao navegador que comprreender as duas marcações sendo da página HTML-->
<head><!-- As tags <head> e </head> são usadas como cabeçalho da página, contendo um conjunto de informações da página -->
    <meta charset="UTF-8"><!--Atributo charset colocado na teg meta com valor UTF-8 indicando o formato de codificação de caracteres do documento aos sites-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Sites Favoritos</title><!--Tag meta com atributos de configuração da visualização da área visível para página da web-->
</head><!--Tag </head> finalizando o cabeçalho da página-->
<body><!--tag <body></body> contém o corpo da página, ou seja, é o que será exibido pelo navegador em sua janela-->
    <h1>Meus Sites Favoritos: Inês Martinelli</h1><br><!--As tags <h1> e </h1> marca o título e recebe uma configuração padrão para aumento de tamanho de letra-->
    <figure><!--Tag <figure> para definir marcação para a legenda da imagem-->
        <h1><figcaption>GitHub</figcaption></h1><!--Tag <figcaption> utilizada para o navegador e motores de busca encontrar com facilidade a marcação da legenda da imagem-->
            <img src="github.png" alt="GitHub"><br><!--Tag <img> juntamente com o atributo src="", fazem referência ao local da imagem. O atributo alt também é utilizado para garantir que o nome da imagem seja mostrado-->
            <a href="https://www.github.com/" target="_blank">Acesse o GitHub</a><br><br><!--As tags <a> são utilizadas para colocar os links do site.-->
        <h1><figcaption>LinkedIn</figcaption></h1><!--Avtag header (<h1>) é utilizada para destacar títulos e subtítulos da página-->
            <img src="linkedin.jpg" alt="LinkedIn"><br><!--A tag <br> utilizada marca onde será realizada um quebra de linha -->
            <a href="https://www.linkedin.com/" target="_blank">Acesse o LinkedIn</a><br><br>
        <h1><figcaption>Centro Paula Souza</figcaption></h1><!--A tag h1 é a abreviação do inglês para Header 1, que torna a fonte maior-->
            <img src="centro-paula-souza.png" alt="Centro Paula Souza"><br>
            <a href="https://www.centropaulasouza.com/" target="_blank">Acesse o Centro Paula Souza</a><br><br>
        <h1><figcaption>Google</figcaption></h1>
            <img src="google.png" alt="Google"><br>
            <a href="https://www.google.com/" target="_blank">Acesse o Google</a><br><br>
        <h1><figcaption>YouTube</figcaption></h1>
            <img src="youtube.png" alt="YouTube"><br>
            <a href="https://www.youtube.com/" target="_blank">Acesse o YouTube</a><br><br>
    </figure>
</body>
</html>
